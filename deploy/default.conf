# nginx DENTRO del contenedor: sirve dist/ y hace de proxy de lectura a la web origen.
# El nginx-proxy del VPS (VIRTUAL_HOST) reenvía el tráfico a este contenedor por el puerto 80.
# Ver specs/005-pwa-offline.md.

# DNS interno de Docker: la IP de la web origen se vuelve a resolver cada 30 s.
resolver 127.0.0.11 valid=30s ipv6=off;

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

	location / {
		try_files $uri $uri/index.html =404;
		add_header Cache-Control "no-cache";
	}

	# Archivos con hash en el nombre: cacheables para siempre.
	location /_astro/ {
		try_files $uri =404;
		add_header Cache-Control "public, max-age=31536000, immutable";
	}

	location = /manifest.webmanifest {
		default_type application/manifest+json;
		add_header Cache-Control "no-cache";
	}

	# El service worker nunca se cachea, para que las actualizaciones lleguen.
	location = /sw.js {
		add_header Cache-Control "no-cache";
	}

	# Proxy de solo lectura (GET) a la web origen, limitado a listados y detalles.
	# Los votos se cachean en el navegador (localStorage), no aquí.
	location ~ ^/remote/(candidaturas?/.+)$ {
		limit_except GET { deny all; }
		set $origin https://voluntariado.masorange.es;
		proxy_pass $origin/$1$is_args$args;
		proxy_ssl_server_name on;
		proxy_set_header Host voluntariado.masorange.es;
		proxy_set_header User-Agent "Mozilla/5.0 (SolidariosPWA)";
		proxy_set_header Accept-Encoding "";
		proxy_set_header Cookie "";
		proxy_hide_header Set-Cookie;
		proxy_hide_header Cache-Control;
		add_header Cache-Control "no-cache";
		proxy_connect_timeout 5s;
		proxy_read_timeout 15s;
	}
	location /remote/ {
		return 404;
	}
}
